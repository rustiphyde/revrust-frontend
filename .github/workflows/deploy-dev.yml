name: Deploy Dev Build

on:
  push:
    branches:
      - dev

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to cPanel via SCP
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 -p 2223 69.27.42.172 > ~/.ssh/known_hosts
          ssh-keygen -lf ~/.ssh/known_hosts | grep -F 'SHA256:gNhqxjE6z6cnUiGrrZfyEzZmrL08A+KZk+yXk3TwsiA'
          scp -P 2223 -r dist/. revrust@69.27.42.172:/home/revrust/dev_html/
