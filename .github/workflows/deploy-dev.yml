name: Deploy Dev Build

on:
  push:
    branches:
      - dev

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy via SSH (rsync)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 69.27.42.172
          username: revrust
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            rsync -av --delete dist/ /home/revrust/dev_html/
